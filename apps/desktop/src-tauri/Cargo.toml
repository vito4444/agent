[package]
name = "agent-workbench-ui"
version = "0.1.0"
description = "Tauri 2 shell for the multi-agent workbench"
authors = ["agent workbench"]
edition = "2021"

[lib]
name = "agent_workbench_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
agent-daemon = { path = "../../../crates/agent-daemon" }
agent-core = { path = "../../../crates/agent-core" }
agent-acp = { path = "../../../crates/agent-acp" }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
