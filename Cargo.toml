[workspace]
resolver = "2"
members = [
    "crates/agent-core",
    "crates/agent-acp",
    "crates/agent-daemon",
]
# Tauri shell lives at apps/desktop/src-tauri but is NOT a workspace member:
# Linux CI images often lack webkit2gtk/gdk pkg-config. Build it with:
#   cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml
default-members = [
    "crates/agent-core",
    "crates/agent-acp",
    "crates/agent-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["agent workbench"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
futures = "0.3"
parking_lot = "0.12"
agent-core = { path = "crates/agent-core" }
agent-acp = { path = "crates/agent-acp" }
